<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbital Foundry</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #100a1e; }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #100a1e; outline: none; }
    /* Loading screen in the Comet Garden palette; it fades into the in-game title screen. */
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
               color: #c7b6d3; font: 15px system-ui, sans-serif; gap: 14px; transition: opacity .6s;
               background:
                 radial-gradient(1px 1px at 12% 18%, #a47ca1 99%, transparent), radial-gradient(1px 1px at 82% 12%, #ffde7e 99%, transparent),
                 radial-gradient(2px 2px at 64% 74%, #785787 99%, transparent), radial-gradient(1px 1px at 28% 82%, #a47ca1 99%, transparent),
                 radial-gradient(2px 2px at 90% 58%, #503b6b 99%, transparent), radial-gradient(1px 1px at 45% 30%, #785787 99%, transparent),
                 radial-gradient(1px 1px at 6% 62%, #ffde7e 99%, transparent), radial-gradient(2px 2px at 72% 36%, #a47ca1 99%, transparent),
                 radial-gradient(ellipse at 50% 45%, #241a3d 0%, #100a1e 70%); }
    #loading.done { opacity: 0; pointer-events: none; }
    #orbit { position: relative; width: 150px; height: 150px; margin-bottom: 8px; }
    #orbit .ring { position: absolute; inset: 0; border: 2px solid #725c8c; border-radius: 50%; }
    #orbit .ring.inner { inset: 34px; border-color: #c990a0; }
    #orbit .moon { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #97f7c8; top: -7px; left: 68px;
                   box-shadow: 0 0 14px #97f7c8; }
    #orbit .spin { position: absolute; inset: 0; animation: spin 3.2s linear infinite; }
    #orbit .spin.slow { inset: 34px; animation-duration: 5.5s; animation-direction: reverse; }
    #orbit .spin.slow .moon { background: #ffb199; box-shadow: 0 0 12px #ffb199; left: 34px; width: 12px; height: 12px; top: -6px; }
    #orbit .core { position: absolute; inset: 62px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f6e8e8, #9b8cc2 60%, #443365); }
    @keyframes spin { to { transform: rotate(360deg); } }
    #logo { font: 700 52px system-ui, sans-serif; letter-spacing: 10px; color: #c9f2de; text-align: center; }
    #tagline { letter-spacing: 3px; color: #ffb199; font-size: 15px; text-align: center; }
    #bar { width: 360px; max-width: 80vw; height: 8px; background: #241a3d; border: 1px solid #725c8c; border-radius: 5px; overflow: hidden; margin-top: 18px; }
    #fill { width: 0; height: 100%; background: linear-gradient(90deg, #5cc187, #97f7c8); transition: width .2s; }
    #status { font-size: 13px; color: #aa98be; }
    #error { color: #ff8a7a; max-width: 560px; text-align: center; display: none; }
    @media (max-width: 560px) { #logo { font-size: 32px; letter-spacing: 5px; } }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <div id="orbit">
      <div class="ring"></div><div class="ring inner"></div><div class="core"></div>
      <div class="spin"><div class="moon"></div></div>
      <div class="spin slow"><div class="moon"></div></div>
    </div>
    <div id="logo">ORBITAL FOUNDRY</div>
    <div id="tagline">Mine the asteroids · Power the foundry · Take the frontier</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="status">Downloading the foundry… 0%</div>
    <div id="error"></div>
  </div>
  <script>
    var canvas = document.getElementById("unity-canvas");
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/Web.data.unityweb",
      frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
      codeUrl: buildUrl + "/Web.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Orbital Foundry",
      productName: "Orbital Foundry",
      productVersion: "1.0",
      matchWebGLToCanvasSize: true
    };
    function showError(message) {
      var e = document.getElementById("error");
      e.textContent = "The game could not start: " + message;
      e.style.display = "block";
    }
    var script = document.createElement("script");
    script.src = buildUrl + "/Web.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.getElementById("fill").style.width = (100 * progress) + "%";
        document.getElementById("status").textContent = progress < 0.9
          ? "Downloading the foundry… " + Math.round(100 * progress) + "%"
          : "Starting the engines…";
      }).then(function () {
        var loading = document.getElementById("loading");
        loading.classList.add("done");
        setTimeout(function () { loading.style.display = "none"; }, 700);
        canvas.focus();
      }).catch(function (message) { showError(message); });
    };
    script.onerror = function () { showError("the game files failed to download."); };
    document.body.appendChild(script);
  </script>
</body>
</html>
